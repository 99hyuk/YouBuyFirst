<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026-05-18 Front Visual History</title>
    <style>
      :root {
        color: #17212b;
        background: #eef3f8;
        font-family:
          Pretendard,
          "Pretendard Variable",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 34px 0 64px;
      }

      header {
        display: grid;
        gap: 10px;
        margin-bottom: 24px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 28px;
      }

      p {
        color: #627084;
        font-size: 14px;
        line-height: 1.55;
      }

      a {
        color: #2f6fed;
        font-size: 13px;
        font-weight: 760;
        text-decoration: none;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }

      .actions a {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 12px;
        border: 1px solid #d8e1ec;
        border-radius: 999px;
        background: #ffffff;
        color: #26384f;
      }

      .gallery {
        display: grid;
        gap: 26px;
      }

      article {
        display: grid;
        gap: 12px;
        padding: 16px;
        border: 1px solid #dfe5ec;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 14px 36px rgba(39, 51, 67, 0.08);
      }

      h2 {
        font-size: 18px;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #dfe5ec;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>2026-05-18</h1>
        <p>제품 기획 중심으로 대시보드, 종목 상세, 커뮤니티, 주요 지표, 에이전트, 포트폴리오 화면을 확장한 버전입니다.</p>
        <div class="actions">
          <a href="../index.html">전체 날짜로 돌아가기</a>
          <a href="file:///C:/agents/YouBuyFirst/.worktrees/front-dashboard-design-polish/front/public/visual-history/2026-05-18/">로컬 이미지 폴더 열기</a>
        </div>
      </header>

      <section class="gallery">
        <article>
          <h2>Dashboard · product surface</h2>
          <p>관심종목 요약, 이벤트 타임라인 미리보기, 데이터 기준 시각을 전면에 둔 대시보드입니다.</p>
          <img src="./FV-20260518-1005-product-surface-dashboard.png" alt="2026-05-18 dashboard product surface" />
        </article>

        <article>
          <h2>Stock detail · core screen</h2>
          <p>종목 헤더, 반응 추이, 소스별 반응, 이벤트 타임라인, 근거 링크, 신뢰도, 어제와 달라진 점을 넣은 종목 상세입니다.</p>
          <img src="./FV-20260518-1005-product-surface-stock-detail.png" alt="2026-05-18 stock detail core screen" />
        </article>
      </section>
    </main>
  </body>
</html>
